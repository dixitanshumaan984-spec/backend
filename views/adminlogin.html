<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Engineers Learning</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Sora", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(-45deg, #1a1a2e, #2a5298, #4a6cf7, #3358e8);
      background-size: 400% 400%;
      animation: gradientMove 10s ease infinite;
    }

    @keyframes gradientMove {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .login-box {
      background: white;
      border-radius: 16px;
      padding: 40px 36px;
      width: 360px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      text-align: center;
    }

    .shield {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #4a6cf7, #3358e8);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 20px;
      box-shadow: 0 4px 15px rgba(74,108,247,0.4);
    }

    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 28px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #444;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: "Sora", sans-serif;
      outline: none;
      transition: 0.3s;
    }

    .input-group input:focus {
      border-color: #4a6cf7;
      box-shadow: 0 0 0 3px rgba(74,108,247,0.12);
    }

    .error-msg {
      background: #fef2f2;
      color: #ef4444;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
      text-align: left;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #4a6cf7, #3358e8);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      font-family: "Sora", sans-serif;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 14px rgba(74,108,247,0.35);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(74,108,247,0.5);
    }

    .back-link {
      display: block;
      margin-top: 18px;
      font-size: 13px;
      color: #4a6cf7;
      text-decoration: none;
    }

    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="login-box">

    <div class="shield">🔒</div>
    <h1>Admin Access</h1>
    <p class="subtitle">Engineers Learning — Restricted Area</p>

    <div class="error-msg" id="errorMsg">❌ Wrong password. Try again.</div>

    <div class="input-group">
      <label>Admin Password</label>
      <input type="password" id="adminPassword" placeholder="Enter admin password" required>
    </div>

    <button class="login-btn" onclick="adminLogin()">Enter Admin Panel →</button>

    <a href="index.html" class="back-link">← Back to Home</a>

  </div>

  <script>
    // Allow pressing Enter key to submit
    document.getElementById("adminPassword").addEventListener("keydown", function(e) {
      if (e.key === "Enter") adminLogin();
    });

    async function adminLogin() {
      const password = document.getElementById("adminPassword").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      if (!password) {
        errorMsg.textContent = "⚠️ Please enter a password.";
        errorMsg.style.display = "block";
        return;
      }

      const res = await fetch("/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password })
      });

      const data = await res.json();

      if (data.success) {
        window.location.href = "/admin";
      } else {
        errorMsg.textContent = "❌ " + data.message;
        errorMsg.style.display = "block";
        document.getElementById("adminPassword").value = "";
        document.getElementById("adminPassword").focus();
      }
    }
  </script>

</body>
</html>
