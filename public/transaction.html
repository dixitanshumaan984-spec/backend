<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Payment</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  text-align: center;
}

.container {
  background: white;
  margin: 50px auto;
  padding: 20px;
  width: 90%;
  max-width: 400px;
  border-radius: 10px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
}

button {
  padding: 12px;
  width: 100%;
  background: green;
  color: white;
  border: none;
}
</style>
</head>

<body>

<div class="container">
  <h2 id="courseTitle">Submit Payment</h2>

  <form id="txnForm">
    <input type="text" id="name" placeholder="Your Name" required>
    <input type="email" id="email" placeholder="Your Email" required>
    <input type="text" id="txnId" placeholder="Transaction ID" required>
    
    <button type="submit">Submit</button>
  </form>

  <p id="msg" style="color:green; display:none;">
    ⏳ Payment submitted! Waiting for approval
  </p>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const course = params.get("course");

if (course) {
  document.getElementById("courseTitle").innerText =
    "Submit Payment for " + course;
}

document.getElementById("txnForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const txnId = document.getElementById("txnId").value;

  if (txnId.length < 6) {
    alert("Enter valid Transaction ID");
    return;
  }

  const res = await fetch("/save-payment", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      name,
      email,
      course,
      transactionId: txnId,
      status: "pending"
    })
  });

  document.getElementById("msg").innerText = "⏳ Waiting for approval...";
document.getElementById("msg").style.display = "block";

// 🔁 Check status every 5 seconds
setInterval(async () => {
  const res = await fetch(`/check-status?email=${email}&course=${course}`);
  const data = await res.json();

  // ✅ Approved
  if (data.status === "approved") {
  document.getElementById("msg").innerText = "✅ Payment Successful! Redirecting to course...";

  setTimeout(() => {
    window.location.href = "mlcourse.html";
  }, 2000);
}

  // ❌ Failed
  if (data.status === "failed") {
    document.getElementById("msg").innerText = "❌ Payment Failed! Please try again.";
  }

}, 5000);

});
</script>

</body>
</html>
