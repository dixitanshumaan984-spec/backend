<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Engineers Learners</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;

      /* Animated Gradient */
      background: linear-gradient(-45deg, #94d122, #2a5298, #1e3c72, #00c6ff);
      background-size: 400% 400%;
      animation: gradientMove 10s ease infinite;

      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .login-container {
      background: #fff;
      padding: 40px 35px;
      border-radius: 15px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      text-align: center;
      width: 320px;
    }

    /* Animated Icon */
    .login-container img {
      width: 80px;
      margin-bottom: 10px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    .login-container h1 {
      color: rgb(90, 85, 85);
      margin-bottom: 8px;
      font-size: 24px;
    }

    .login-container p {
      color: #444;
      font-size: 14px;
      margin-bottom: 20px;
      font-style: italic;
    }

    .login-container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: 0.3s;
    }

    .login-container input:focus {
      border-color: #2a5298;
      box-shadow: 0 0 6px rgba(42,82,152,0.4);
    }

    .login-container button {
      position: relative;
      overflow: hidden;
      background: #2a5298;
      color: #fff;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-container button:hover {
      background: #1e3c72;
    }

    .login-container button:active {
      transform: scale(0.96);
    }

    /* Ripple */
    .login-container button span {
      position: absolute;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      transform: scale(0);
      animation: ripple 0.6s linear;
    }

    @keyframes ripple {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="login-container">

    <!-- Image -->
    <img src="https://cdn-icons-png.flaticon.com/512/1055/1055687.png" alt="CS Icon">

    <h1>Engineers Learning</h1>
    <p>"Empowering learners to build tomorrow's innovations."</p>

    <!-- IMPORTANT: keep your form same -->
    <form method="POST" action="/login" id="loginForm">
  <input type="text" name="username" id="username" placeholder="Enter your name" required>
  <input type="password" name="password" id="password" placeholder="Enter password" required>
  <button type="submit">Login</button>
</form>

  </div>

  <!-- KEEP your original JS -->
  <script src="login.js"></script>

  <!-- Only animation JS added -->
  <script>
    const button = document.querySelector("button");

    button.addEventListener("click", function(e) {
      const circle = document.createElement("span");
      const rect = button.getBoundingClientRect();

      circle.style.left = e.clientX - rect.left + "px";
      circle.style.top = e.clientY - rect.top + "px";

      this.appendChild(circle);

      setTimeout(() => circle.remove(), 600);
    });
  </script>

</body>
</html>
