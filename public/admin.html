<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 20px;
    }

    h2 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 15px;
      margin: 10px auto;
      max-width: 500px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    button {
      background: green;
      color: white;
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .approved {
      color: green;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>Admin Payment Panel</h2>

<div id="payments"></div>

<script>

// 🔄 Load all payments
async function loadPayments() {
  const res = await fetch("/admin/payments");
  const data = await res.json();

  const container = document.getElementById("payments");
  container.innerHTML = "";

  data.forEach(p => {
    container.innerHTML += `
      <div class="card">
        <p><b>Name:</b> ${p.name}</p>
        <p><b>Email:</b> ${p.email}</p>
        <p><b>Course:</b> ${p.course}</p>
        <p><b>Txn ID:</b> ${p.transactionId}</p>
        <p><b>Status:</b> ${p.status}</p>

        ${
          p.status === "pending"
          ? `<button onclick="approve('${p._id}')">Approve</button>
<button style="background:red;" onclick="disapprove('${p._id}')">Disapprove</button>`
          : `<p class="approved">Approved ✅</p>`
        }
      </div>
    `;
  });
}

// ✅ Approve function
async function approve(id) {
  await fetch("/admin/approve/" + id, {
    method: "POST"
  });

  alert("Payment Approved ✅");
  loadPayments(); // refresh list
}

// Load on page open
loadPayments();
async function disapprove(id) {
  await fetch("/admin/disapprove/" + id, {
    method: "POST"
  });

  alert("Payment Disapproved ❌");
  loadPayments();
}

</script>

</body>
</html>
