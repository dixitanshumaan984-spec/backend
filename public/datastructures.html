<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Structures Course</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background-color: #1e1e1e;
      color: white;
      padding: 15px;
    }

    .banner img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    .course-details {
      padding: 20px;
    }

    ul {
      text-align: left;
      display: inline-block;
    }

    .images {
      margin-top: 20px;
    }

    .course-img {
      width: 150px;
      margin: 10px;
    }

    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background-color: purple;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Data Structures Course</h1>
  </header>

  <!-- Banner -->
  <div class="banner">
    <img src="https://images.unsplash.com/photo-1515879218367-8466d910aaa4" alt="Programming Banner">
  </div>

  <main>
    <section class="course-details">

      <h2>Price: ₹3999</h2>

      <h3>Course Outcomes:</h3>
      <ul>
        <li>Master DSA in JAVA</li>
        <li>Master arrays, linked lists, stacks, and queues</li>
        <li>Understand searching, sorting, backtracking, and greedy algorithms</li>
        <li>Prepare for coding interviews with 500+ coding questions</li>
      </ul>

      <!-- DSA + Java Images -->
      <div class="images">
        <img src="https://cdn-icons-png.flaticon.com/512/226/226777.png" alt="Java" class="course-img">
        <img src="https://cdn-icons-png.flaticon.com/512/2103/2103658.png" alt="Array" class="course-img">
        <img src="https://cdn-icons-png.flaticon.com/512/2721/2721297.png" alt="Linked List" class="course-img">
        <img src="https://cdn-icons-png.flaticon.com/512/2620/2620578.png" alt="Stack" class="course-img">
        <img src="https://cdn-icons-png.flaticon.com/512/1055/1055687.png" alt="Queue" class="course-img">
      </div>

      <a href="enroll.html?course=Data%20Structures" class="btn">Enroll</a>

    </section>
  </main>

</body>
</html>
