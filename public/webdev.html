<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Development Course</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background-color: #333;
      color: white;
      padding: 15px;
    }

    .banner img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    .course-img {
      width: 200px;
      margin: 10px;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: blue;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    .images {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Web Development</h1>
  </header>

  <!-- Banner Image -->
  <div class="banner">
    <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085" alt="Web Development Banner">
  </div>

  <main>
    <section>
      <h2>About this course</h2>

      <p>Learn Frontend Development with HTML, CSS, JavaScript, Tailwind CSS and React.</p>
      <p>BackEnd Development with Node.js, Express, and MongoDB.</p>
      <p>Industry level projects to build your portfolio.</p>

      <!-- Course Images -->
      <div class="images">
        <img src="https://cdn-icons-png.flaticon.com/512/732/732212.png" alt="HTML" class="course-img">
        <img src="https://cdn-icons-png.flaticon.com/512/732/732190.png" alt="CSS" class="course-img">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968292.png" alt="JavaScript" class="course-img">
        <img src="https://cdn-icons-png.flaticon.com/512/919/919825.png" alt="NodeJS" class="course-img">
      </div>

      <h3>Price: ₹4499</h3>

      <a href="#" class="btn" onclick="handleEnroll()">Enroll</a>
    </section>
  </main>
<script>
function handleEnroll() {
  const params = new URLSearchParams(window.location.search);
  const user = params.get("user");

  if (user) {
    // ✅ If logged in → go to enroll page
    window.location.href = "enroll.html?course=Web Development&user=" + user;
  } else {
    // ❌ If not logged in → redirect to login
    alert("Please login first!");
    window.location.href = "login.html";
  }
}
</script>
</body>
</html>
