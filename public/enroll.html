<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Enrollment - Engineer Learners</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      margin: 0;
      padding: 0;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .form-box {
      background: #fff;
      color: #333;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 450px;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    .form-box h2 {
      margin-bottom: 20px;
      color: #2575fc;
    }

    .form-box input, .form-box select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    .form-box button {
      background: #2575fc;
      color: #fff;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
      width: 100%;
    }

    .form-box button:hover {
      background: #6a11cb;
    }

    #successMsg {
      display: none;
      margin-top: 15px;
      color: green;
      font-weight: bold;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(-20px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <div class="form-box">
    <h2 id="courseTitle">Course Enrollment</h2>
    <form id="enrollForm">
      <input type="text" id="name" placeholder="Full Name" required>
<input type="email" id="email" placeholder="Email Address" required>
      <select required>
        <option value="">Select Payment Method</option>
        <option value="upi">UPI</option>
        <option value="credit">Credit Card</option>
        <option value="debit">Debit Card</option>
        <option value="netbanking">Net Banking</option>
      </select>
      <button type="submit">Confirm Enrollment</button>
    </form>
    <p id="successMsg">✅ Enrolled Successfully! Redirecting...</p>
  </div>

  <script>
    // Get course name from URL
    const params = new URLSearchParams(window.location.search);
    const course = params.get("course");
    if (course) {
      document.getElementById("courseTitle").textContent = "Enroll in " + course;
    }

    // Form submission handling
    document.getElementById("enrollForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;

  const params = new URLSearchParams(window.location.search);
  const course = params.get("course");

  window.location.href =
    "payment.html?course=" + encodeURIComponent(course) +
    "&name=" + encodeURIComponent(name) +
    "&email=" + encodeURIComponent(email);
});
  </script>
</body>
</html>
